apiVersion: apps/v1
kind: Deployment
metadata:
  name: dept-portal-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: dept-portal
  template:
    metadata:
      labels:
        app: dept-portal
    spec:
      containers:
      - name: dept-portal-container
        image: tanshul12/dept-portal:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: dept-portal-service
spec:
  type: NodePort
  selector:
    app: dept-portal
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30030
